function initCanvas(){stopCanvas();canvas=$('#worldCanvas');if(!canvas)return;ctx=canvas.getContext('2d');const d=window.devicePixelRatio>1?2:1;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);hero={x:165,y:365,tx:165,ty:365,target:null};keys={};holdKey='';particle=[];lastFrame=0;message='Ketuk NPC untuk memulai cerita. Ambil koin yang bersinar.';canvas.addEventListener('pointerdown',canvasClick);raf=requestAnimationFrame(loop)}

function canvasClick(e){if(!canvas)return;const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*W;const y=(e.clientY-rect.top)/rect.height*H;let target=null;for(const [n,p] of Object.entries(objects))if(Math.hypot(x-p.x,y-p.y)<67){target=n;break}if(!target)for(let i=0;i<coinPos.length;i++)if(!regionData(activeRegion).coins.includes(i)&&Math.hypot(x-coinPos[i].x,y-coinPos[i].y)<53){target='coin'+i;break}if(target)walkTo(target);else{hero.tx=clamp(x,105,850);hero.ty=clamp(y,157,431);hero.target=null;}}
function walkTo(name){const p=name.startsWith('coin')?coinPos[Number(name[4])]:objects[name];if(!p)return;hero.tx=p.x;hero.ty=p.y+29;hero.target=name;tell('🚶 Penjelajah menuju '+({npc:'NPC penjaga',book:'buku pengetahuan',mission:'batu misi',gate:'gerbang kristal'}[name]||'koin')+'...')}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function label(text,x,y,bg='#15133cd9'){ctx.font='bold 15px system-ui';const w=ctx.measureText(text).width+24;rounded(x-w/2,y-17,w,29,12,bg);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(text,x,y-2)}
function crystal(x,y,size,color='#9efbff',t=0){ctx.save();ctx.translate(x,y+Math.sin(t)*4);ctx.shadowColor=color;ctx.shadowBlur=20;poly([[0,-size],[-size*.72,-size*.2],[-size*.55,size*.7],[0,size],[size*.65,size*.3],[size*.7,-size*.3]],color,'#ffffff88');poly([[0,-size],[0,size],[size*.7,-size*.3]],'#ffffff55');ctx.restore()}
function tree(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ellipse(0,15,27,9,'#102b4980');rounded(-9,-27,18,45,6,'#684075');circle(0,-44,31,'#216c6e');circle(-20,-30,24,'#38be88');circle(18,-30,24,'#69d4a1');circle(5,-61,20,'#9bf7bd');ctx.restore()}
function rock(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(2,11,31,10,'#12204450');poly([[-32,6],[-23,-18],[-5,-31],[24,-16],[34,8]],'#7173b7','#b5acf2');poly([[-23,-18],[-5,-31],[0,6],[-32,6]],'#b5a0e6');ctx.restore()}
function flower(x,y,t){circle(x,y+Math.sin(t)*2,5,'#ffb7ed');circle(x-8,y,4,'#ffec96');circle(x+8,y,4,'#ffec96');circle(x,y-7,4,'#a8fbe6')}
function drawScene(t){const r=regions[activeRegion],rs=regionData(activeRegion);const grd=ctx.createLinearGradient(0,0,W,H);grd.addColorStop(0,r.sky[0]);grd.addColorStop(1,r.sky[1]);ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

for(let i=0;i<48;i++){const x=(i*193+37)%W,y=(i*89+13)%H;circle(x+Math.sin(t*.12+i)*2,y, (i%5===0)?2.1:1,'#ffffff'+(i%4===0?'ba':'68'))}
for(let i=0;i<5;i++){const x=(i*220+80+Math.sin(t*.18+i)*12)%1050-65,y=80+(i%3)*78+Math.sin(t*.6+i)*5;ellipse(x,y+14,70,11,'#150c4094');poly([[x-69,y],[x+67,y],[x+32,y+38],[x-24,y+33]],'#392b7699');ellipse(x,y,72,17,'#b4aaf26b')}
// mystical cloud mists

// large floating island dark underside and top
ctx.save();ctx.shadowColor='#0b0738';ctx.shadowBlur=44;ellipse(487,371,424,169,'#1d1a48');ctx.restore();
poly([[70,305],[85,390],[210,455],[430,493],[622,482],[814,429],[892,333],[839,361],[640,427],[397,444],[160,405]],'#3d3373');
let land=ctx.createRadialGradient(485,270,65,485,340,425);land.addColorStop(0,activeRegion===4?'#c37ad4':activeRegion===0?'#83d9ac':'#9bc2d8');land.addColorStop(1,r.colors[0]);ctx.save();ctx.shadowColor='#030d2a';ctx.shadowBlur=20;ellipse(480,320,418,162,land);ctx.restore();
ctx.strokeStyle='#e5faff35';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(480,320,416,160,0,0,Math.PI*2);ctx.stroke();
// trail across the island
ctx.save();ctx.lineCap='round';ctx.strokeStyle='#fff3cb7a';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(150,365);ctx.bezierCurveTo(280,240,381,390,500,312);ctx.bezierCurveTo(655,225,729,410,832,258);ctx.stroke();ctx.strokeStyle='#9e85a84d';ctx.lineWidth=4;ctx.setLineDash([5,18]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
// world decoration

if(i===4){if(mini.step===0){const result=(22/7*7*7*mini.bossAngle/360).toFixed(1);s=`<div class="mg-grid"><div><h3>⚔️ Boss Challenge: Perisai Juring</h3><p>Raja Sigma menemukan perisai berbentuk juring. Jari-jarinya <strong>7 meter</strong>, dengan luas yang dibutuhkan <strong>77 m²</strong>. Tentukan sudut pusat yang tepat.</p><div class="meter-block"><div>Sudut yang dipilih</div><div class="numbers" id="bossValue">${mini.bossAngle}°</div><input class="meter" id="bossSlider" type="range" min="15" max="360" step="5" value="${mini.bossAngle}" aria-label="Ubah sudut untuk mengalahkan boss"/><div>Luas perisai: <strong id="bossArea">${result}</strong> m²</div></div><button class="btn" data-action="checkBoss" style="margin-top:14px">⚔️ Serang Perisai</button></div><div id="bossVisual">${sectorSVG(mini.bossAngle)}</div></div>`}
else{s=`<div style="text-align:center"><h3>✨ Satukan lima Kristal Matematika</h3><p>Perisai telah pecah! Ketuk setiap kristal yang berkedip untuk mengisi mahkota Negeri Juring.</p><div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px 0">${Array.from({length:5},(_,j)=>`<button class="formula-piece" style="font-size:38px;${j<mini.shards?'background:#40746e':''}" data-action="shard" data-value="${j}" ${j<mini.shards?'disabled':''}>${j<mini.shards?'💎':'🔮'}<span style="display:block;font-size:11px">${j<mini.shards?'Aktif':'Kristal '+(j+1)}</span></button>`).join('')}</div><p>Kristal tersatukan: <strong>${mini.shards}/5</strong></p></div>`}}
return `<div class="minigame">${s}<div id="mgFeedback" class="status-message" style="margin-top:13px"></div></div>`}
function renderMini(){if(!modal)return;$('#overlay').innerHTML=`<div class="dialog-back" id="backdrop"><div class="dialog large" role="dialog" aria-modal="true" aria-label="Mini-game"><button class="dialog-close" data-action="close" aria-label="Tutup">×</button>${miniHeading()}${miniMarkup()}<div class="note">💡 Kesalahan tidak mengunci permainan. Energi akan kembali saat menemukan hadiah.</div></div></div>`}
function completeRegion(){let rs=regionData(activeRegion);if(rs.solved)return;rs.solved=true;state.coins+=60;state.stars+=Math.max(1,mini.attempt===0?3:mini.attempt<=2?2:1);state.crystals++;state.energy=5;if(!state.badgeIds.includes(activeRegion))state.badgeIds.push(activeRegion);if(activeRegion===4){state.completed=true;let board=load(LEAD,[]);board.push({name:state.name,stars:state.stars,coins:state.coins,crystals:state.crystals});save(LEAD,board.sort((a,b)=>b.stars-a.stars||b.coins-a.coins).slice(0,30))}save(STORE,state);updateHUD();sparkle(35);$('#overlay').innerHTML=`<div class="dialog-back"><div class="dialog" style="text-align:center"><div style="font-size:70px">${activeRegion===4?'🏆':'💎'}✨</div><div class="eyebrow">WILAYAH BERHASIL DITAKLUKKAN</div><h2>Hebat, ${escapeHTML(state.name)}!</h2><p>Kristal ${regions[activeRegion].name} berhasil kamu selamatkan. Gerbang petualangan kini terbuka.</p><div class="statline" style="justify-content:center;margin:24px 0"><div class="statmini"><strong>+60</strong><span>🪙 Koin</span></div><div class="statmini"><strong>+${Math.max(1,mini.attempt===0?3:mini.attempt<=2?2:1)}</strong><span>⭐ Bintang</span></div><div class="statmini"><strong>+1</strong><span>💎 Kristal</span></div></div><p class="award" style="justify-content:center">${regions[activeRegion].badgeIcon} Lencana: ${regions[activeRegion].badge}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px"><button class="btn" data-action="finishMission">${activeRegion===4?'🏆 Lihat Hasil Akhir':'🚪 Menuju Gerbang'}</button><button class="btn soft" data-action="close">Jelajahi Lagi</button></div></div></div>`;modal='reward';tell('🏅 Misi selesai! Gerbang kini terbuka.');}
function verifyMini(a,v){const i=activeRegion;if(a==='wedge'){let j=Number(v);if(mini.sectors.includes(j)){mini.sectors=mini.sectors.filter(x=>x!==j)}else{if(j>1){fail('Potongan yang dipilih bukan bagian juring target');return}mini.sectors.push(j)}if(mini.sectors.length===2){mini.step=1;successStep('Juring 120° terbentuk!')}renderMini();return}
if(a==='clearWedge'){mini.sectors=[];renderMini();return}
if(a==='spot'){let needed=['center','radius','arc'][mini.match];if(v===needed){mini.match++;if(mini.match===3){completeRegion();return}successStep('Unsur cocok!');renderMini()}else fail('Itu bukan '+['titik pusat','jari-jari','busur'][mini.match]);return}
if(a==='checkAngle'){if(mini.angle===135){completeRegion()}else fail('Gerbang membutuhkan sudut pusat tepat 135°');return}
if(a==='checkRadius'){if(mini.radius===14){mini.step=1;successStep('Luas 154 cm² tepat. Jembatan terbentuk!');renderMini()}else fail('Periksa kembali hasil luas juring terhadap 154 cm²');return}
if(a==='arcChoice'){if(Number(v)===90)completeRegion();else fail('Busur yang dicari adalah seperempat lingkaran');return}
if(a==='formula'){let j=Number(v);if(!mini.formula.includes(j)&&mini.formula.length<4)mini.formula.push(j);renderMini();return}
if(a==='removeFormula'){let j=Number(v);if(j<mini.formula.length)mini.formula.splice(j,1);renderMini();return}
if(a==='clearFormula'){mini.formula=[];renderMini();return}
if(a==='checkFormula'){if(mini.formula.join(',')==='0,1,2,3'){mini.step=1;successStep('Rumus sudah benar!');renderMini()}else fail('Susun θ ÷ 360° × π × r²');return}
if(a==='checkArea'){const input=$('#formulaAnswer');if(input&&Number(input.value)===154){completeRegion()}else fail('Luas yang benar diperoleh dari 1/4 × 22/7 × 14²');return}
if(a==='checkBoss'){if(mini.bossAngle===180){mini.step=1;successStep('Perisai Boss hancur!');renderMini()}else fail('Coba hitung θ = L ÷ (πr²) × 360°');return}
if(a==='shard'){if(Number(v)===mini.shards){mini.shards++;successStep('Kristal '+mini.shards+' aktif!');if(mini.shards===5)completeRegion();else renderMini()}else fail('Satukan kristal sesuai urutan angka');return}}
function refreshSlider(id,value){if(!modal||modal!=='mission')return;const v=Number(value);if(id==='angleSlider'){mini.angle=v;$('#angleValue').textContent=v+'°';$('#angleVisual').innerHTML=sectorSVG(v)}if(id==='radiusSlider'){mini.radius=v;$('#radiusValue').textContent=v;$('#areaValue').textContent=(22/7*v*v/4).toFixed(1);$('#radiusVisual').innerHTML=sectorSVG(90,v/21*96)}if(id==='bossSlider'){mini.bossAngle=v;$('#bossValue').textContent=v+'°';$('#bossArea').textContent=(22/7*7*7*v/360).toFixed(1);$('#bossVisual').innerHTML=sectorSVG(v)}}
function certificatePNG(){const C=document.createElement('canvas');C.width=1500;C.height=1060;const c=C.getContext('2d');let g=c.createLinearGradient(0,0,1500,1060);g.addColorStop(0,'#fff9da');g.addColorStop(1,'#f4e6ff');c.fillStyle=g;c.fillRect(0,0,1500,1060);c.strokeStyle='#9364c1';c.lineWidth=24;c.strokeRect(32,32,1436,996);c.strokeStyle='#d0a852';c.lineWidth=6;c.strokeRect(57,57,1386,946);function txt(s,y,sz,col='#422867',font='Georgia',weight='bold'){c.fillStyle=col;c.textAlign='center';c.font=`${weight} ${sz}px ${font}`;c.fillText(s,750,y)}txt('✦   AKADEMI MATEMATIKA NEGERI JURING   ✦',159,36,'#8854aa','system-ui');txt('SERTIFIKAT',285,85);txt('PENJELAJAH MATEMATIKA',365,53);txt('Dianugerahkan dengan bangga kepada',475,31,'#695376','system-ui','normal');let name=state.name;let sz=Math.min(74,Math.floor(1100/Math.max(6,name.length)*1.6));txt(name,581,Math.max(31,sz),'#3d2d73');c.strokeStyle='#cfaa73';c.lineWidth=2;c.beginPath();c.moveTo(295,607);c.lineTo(1205,607);c.stroke();txt('Berhasil menyelamatkan 5 Kristal Matematika',687,34,'#655778','system-ui','normal');txt('dan menaklukkan seluruh wilayah luas juring lingkaran',734,30,'#655778','system-ui','normal');txt('⭐ '+state.stars+' Bintang     •     🪙 '+state.coins+' Koin     •     💎 5 Kristal',840,35,'#725199','system-ui');txt(new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),933,30,'#8a7b99','system-ui','normal');const a=document.createElement('a');a.download='Sertifikat_Juring_Adventure_'+state.name.replace(/[^a-z\d-]/gi,'_')+'.png';a.href=C.toDataURL('image/png');document.body.append(a);a.click();a.remove();announce('🎓 Sertifikat PNG siap disimpan')}
function begin(){const raw=$('#playerName');const name=raw?raw.value.trim():'';if(name.length<2){$('#nameError').textContent='Masukkan nama minimal 2 karakter terlebih dahulu.';if(raw)raw.focus();return}state=fresh();state.name=name;state.character=selectedChar;state.regions[0].visited=true;activeRegion=0;save(STORE,state);go('explore');announce('✨ Selamat datang di Negeri Juring, '+name+'!')}
function action(a,v){if(['wedge','clearWedge','spot','checkAngle','checkRadius','arcChoice','formula','removeFormula','clearFormula','checkFormula','checkArea','checkBoss','shard'].includes(a)){verifyMini(a,v);return}switch(a){case 'setup':selectedChar=state.character||0;go('setup');break;case 'pick':selectedChar=Number(v);document.querySelectorAll('.character').forEach(el=>el.classList.toggle('active',Number(el.dataset.value)===selectedChar));break;case 'start':begin();break;case 'map':if(state.name)go('map');else go('setup');break;case 'enter':{let i=Number(v);if(unlocked(i)){activeRegion=i;regionData(i).visited=true;save(STORE,state);go('explore')}}break;case 'walk':walkTo(v);break;case 'npc':openModal('npc');break;case 'mission':openMission();break;case 'journal':openModal('journal');break;case 'leader':openModal('leader');break;case 'info':openModal('info');break;case 'close':closeModal();break;case 'finishMission':if(activeRegion===4){go('ending');sparkle(25)}else{closeModal();walkTo('gate')}break;case 'ending':go('ending');break;case 'downloadCert':certificatePNG();break;case 'printCert':window.print();break;case 'sound':document.body.classList.toggle('reduce-motion');nav();announce(document.body.classList.contains('reduce-motion')?'Animasi dikurangi':'Animasi aktif');break;case 'reset':openModal('reset');break;case 'confirmReset':state=fresh();save(STORE,state);activeRegion=0;go('home');break}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();action(el.dataset.action,el.dataset.value)}});
document.addEventListener('input',e=>{if(['angleSlider','radiusSlider','bossSlider'].includes(e.target.id))refreshSlider(e.target.id,e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(e.key==='Enter'&&page==='setup'&&document.activeElement?.id==='playerName'){begin();return}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key))return;if(page!=='explore'||modal||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;keys[e.key]=true;e.preventDefault()});document.addEventListener('keyup',e=>{delete keys[e.key]});
document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-dir]');if(!b||page!=='explore'||modal)return;holdKey=b.dataset.dir;b.classList.add('held');e.preventDefault()});function unhold(){holdKey='';document.querySelectorAll('.pad.held').forEach(x=>x.classList.remove('held'))}document.addEventListener('pointerup',unhold);document.addEventListener('pointercancel',unhold);window.addEventListener('blur',()=>{unhold();keys={}});
// Prevent clicking dark overlay from dismissing a work-in-progress mini-game accidentally.
document.addEventListener('click',e=>{if(e.target?.id==='backdrop'&&modal!=='mission'&&modal!=='reward')closeModal()});
if(state.name){selectedChar=state.character;page=state.completed?'map':'map'}render();
})();
</script></body></html>
